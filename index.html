<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ghostbar | Portafolio</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fuentes de Google -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Efecto de fondo estilo galaxia -->
    <div class="bg-glow"></div>

    <main class="container">
        <!-- Header / Avatar -->
        <header class="hero">
            <div class="ghost-avatar">
                <!-- Puedes reemplazar esto con tu imagen real luego -->
                <span>👻</span>
            </div>
            <h1 class="glitch-title">ghostbar</h1>
            <p class="subtitle">Desarrollador & Creador Digital</p>
        </header>

        <!-- Sección: Catálogo de Servicios -->
<section class="catalog-section">
    <h2><span class="pixel-deco">✦</span> CATÁLOGO <span class="pixel-deco">✦</span></h2>
    
    <!-- SECCIÓN EXPANDIBLE 1: Menús -->
    <details class="catalog-category">
        <summary>
            <span>🍔 Menús para Restaurantes</span>
            <span class="arrow">▼</span>
        </summary>
        <div class="gallery-grid">
            <!-- Aquí van las imágenes -->
            <div class="gallery-item">
                <img src="https://via.placeholder.com/400x500/0D1B2B/2EC6D6?text=Menu+1" alt="Menú 1">
            </div>
            <div class="gallery-item">
                <img src="https://via.placeholder.com/400x500/0D1B2B/8A3BFF?text=Menu+2" alt="Menú 2">
            </div>
            <div class="gallery-item">
                <img src="https://via.placeholder.com/400x500/0D1B2B/56E4F0?text=Menu+3" alt="Menú 3">
            </div>
        </div>
    </details>

    <!-- SECCIÓN EXPANDIBLE 2: Ejemplo (Podrás borrarla luego) -->
    <details class="catalog-category">
        <summary>
            <span>🎨 Diseño de Logos</span>
            <span class="arrow">▼</span>
        </summary>
        <div class="gallery-grid">
            <div class="gallery-item">
                <img src="https://via.placeholder.com/400x400/0D1B2B/2EC6D6?text=Logo+1" alt="Logo 1">
            </div>
            <div class="gallery-item">
                <img src="https://via.placeholder.com/400x400/0D1B2B/8A3BFF?text=Logo+2" alt="Logo 2">
            </div>
        </div>
    </details>

</section>

        <!-- Sección: Contacto -->
        <section class="contact-section">
            <h2><span class="pixel-deco">✦</span> CONTACTO <span class="pixel-deco">✦</span></h2>
            <div class="contact-links">
                <a href="https://github.com/ghostbar" target="_blank" class="btn-neon">
                    [ GitHub ]
                </a>
                <a href="mailto:tu-correo@ejemplo.com" class="btn-neon">
                    [ Email ]
                </a>
                <!-- Agrega LinkedIn u otras redes si quieres -->
            </div>
        </section>
    </main>

    <footer>
        <p>Diseñado con 🖤 y neón por ghostbar</p>
    </footer>
</body>
</html>
